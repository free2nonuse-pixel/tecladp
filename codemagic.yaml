workflows:
  android-workflow:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Instalar Gradle y preparar entorno
        script: |
          cd mYappo
          # Si no existe gradlew, creamos un empaquetador básico
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          cd mYappo
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - mYappo/app/build/outputs/apk/**/*.apk
